<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - QR Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-gradient-primary fixed-top">
        <div class="container-fluid">
            <a href="../index.html" class="navbar-brand">
                <i class="fas fa-qrcode me-2"></i>QR Attendance System
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-secondary"><i class="fas fa-user-shield me-2"></i>Admin</span>
                <span class="text-white" id="currentDateTime"></span>
                <a href="#" id="logoutBtn" class="btn btn-sm btn-outline-light">Logout</a>
            </div>
        </div>
    </nav>

    <!-- SIDEBAR -->
    <div class="sidebar-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h5 class="mb-0"><i class="fas fa-bars me-2"></i>Menu</h5>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">
                    <i class="fas fa-chart-line"></i><span>Dashboard</span>
                </a>
                <a href="students.html" class="nav-link active">
                    <i class="fas fa-users"></i><span>Students</span>
                </a>
            </nav>
        </aside>
    </div>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- STUDENTS SECTION -->
        <section id="students-section" class="content-section active">
            <div class="page-header">
                <h2><i class="fas fa-users me-2"></i>Student Management</h2>
            </div>

            <div class="card">
                <div class="card-header bg-gradient-primary">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 text-white">Student List</h5>
                        <button class="btn btn-sm btn-light" data-bs-toggle="modal" data-bs-target="#addStudentModal">
                            <i class="fas fa-plus me-2"></i>Add Student
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Student ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="studentTable">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- QR Code Modal -->
    <div class="modal fade" id="qrCodeModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-gradient-primary">
                    <h5 class="modal-title text-white"><i class="fas fa-qrcode me-2"></i>Student QR Code</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <p id="qrStudentInfo" class="mb-3"></p>
                    <div id="qrCodeContainer" style="display: flex; justify-content: center; align-items: center; height: 300px;"></div>
                    <button class="btn btn-primary mt-3" id="downloadQRBtn">
                        <i class="fas fa-download me-2"></i>Download QR Code
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Student Modal -->
    <div class="modal fade" id="addStudentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-gradient-primary">
                    <h5 class="modal-title text-white"><i class="fas fa-user-plus me-2"></i>Add Student</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addStudentForm">
                        <div class="mb-3">
                            <label for="studentId" class="form-label">Student ID *</label>
                            <input type="text" class="form-control" id="studentId" required>
                        </div>
                        <div class="mb-3">
                            <label for="studentName" class="form-label">Student Name *</label>
                            <input type="text" class="form-control" id="studentName" required>
                        </div>
                        <div class="mb-3">
                            <label for="studentEmail" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="studentEmail" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveStudentBtn">Add Student</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Preview Modal -->
    <div class="modal fade" id="imagePreviewModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Snapshot Preview</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="previewImage" src="" alt="Proof" style="max-width: 100%; max-height: 400px;">
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Logout Handler and Date/Time Display -->
    <script>
        // Logout handler
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            sessionStorage.removeItem('currentUser');
            window.location.href = '../auth/login.html';
        });
        
        // Update current date/time
        function updateDateTime() {
            const now = new Date();
            document.getElementById('currentDateTime').textContent = now.toLocaleString();
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>
    
    <!-- App JS -->
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
