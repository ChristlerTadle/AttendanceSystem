<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Attendance Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container-custom">
        <div class="card">
            <div class="card-header">
                <h2>Welcome Back</h2>
                <p>Attendance Management System</p>
            </div>
            <div class="card-body">
                <form id="loginForm">
                    <!-- Role Selection -->
                    <label class="form-label">Select Role</label>
                    <div class="role-selector">
                        <button type="button" class="role-btn active" data-role="teacher">
                             Teacher
                        </button>
                        <button type="button" class="role-btn" data-role="admin">
                             Admin
                        </button>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input 
                            type="email" 
                            class="form-control" 
                            id="email" 
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <!-- Remember Me -->
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember me</label>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn-login">Login</button>

                    <!-- Sign Up Link -->
                    <div class="form-footer">
                        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        // Track selected role
        let selectedRole = 'teacher';

        // Role button listeners
        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                // Remove active class from all buttons
                document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
                // Add active class to clicked button
                this.classList.add('active');
                selectedRole = this.getAttribute('data-role');
            });
        });

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Store user data in session storage
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember').checked;
            
            // Store in localStorage if remember me is checked
            if (rememberMe) {
                localStorage.setItem('attendanceUser', JSON.stringify({
                    email: email,
                    role: selectedRole,
                    rememberMe: true
                }));
            }
            
            // Store current session
            sessionStorage.setItem('currentUser', JSON.stringify({
                email: email,
                role: selectedRole
            }));
            
            // Redirect based on role
            if (selectedRole === 'admin') {
                window.location.href = '../admin/dashboard.html';
            } else if (selectedRole === 'teacher') {
                window.location.href = '../teacher/dashboard.html';
            }
        });
    </script>
</body>
</html>
